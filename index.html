<style>
/* Layout: one-screen field tool. Header strip, ortho map filling the left, block register on the right (stacks under the map on phones). */
:root {
  --bg: #e8eeed;
  --panel: #f8fbfa;
  --fg: #12211f;
  --muted: #566a67;
  --rule: #cdd9d7;
  --accent: #0b7d73;
  --accent-fg: #ffffff;
  --danger: #b4322a;
  --seabed: #c3cfcc;
  --line: #2ff0db;
  --line-sel: #ffd23f;
  --line-bone: #ff5a36;
  --halo: rgba(6, 20, 18, .55);
  --label-bg: rgba(8, 24, 22, .78);
  --label-fg: #f2fffd;
  --draw: #ff7a45;
  --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0a1312; --panel: #101c1b; --fg: #e2eeec; --muted: #8ea4a0; --rule: #223432;
  --accent: #3fd1c2; --accent-fg: #062320; --danger: #ff7b70; --seabed: #0d1a19;
  --label-bg: rgba(4, 14, 13, .82); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0a1312; --panel: #101c1b; --fg: #e2eeec; --muted: #8ea4a0; --rule: #223432;
  --accent: #3fd1c2; --accent-fg: #062320; --danger: #ff7b70; --seabed: #0d1a19;
  --label-bg: rgba(4, 14, 13, .82); color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
#map.lowz .gridlbl.odd { display: none; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--f-body); }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
header {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--rule); background: var(--panel);
}
.site { display: flex; flex-direction: column; min-width: 0; }
.site h1 { margin: 0; font: 700 22px/1.05 var(--f-display); letter-spacing: .01em; text-wrap: balance; }
.site .sub { font: 500 11px/1.3 var(--f-mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.stats { display: flex; gap: 18px; margin-left: auto; font-variant-numeric: tabular-nums; }
.stat { display: flex; flex-direction: column; align-items: flex-end; }
.stat b { font: 600 20px/1 var(--f-display); }
.stat span { font: 500 10px/1.4 var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
button {
  font: 600 14px/1 var(--f-body); border-radius: 6px; padding: 9px 14px; cursor: pointer;
  border: 1px solid var(--rule); background: var(--panel); color: var(--fg);
}
button:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
.main { display: grid; grid-template-columns: 1fr; min-height: max(560px, calc(100vh - 80px)); }
.main.open { grid-template-columns: 1fr 340px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sec-head button { padding: 6px 10px; font-size: 13px; }
#map { background: var(--seabed); min-height: max(560px, calc(100vh - 80px)); height: 100%; position: relative; }
.maperr { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--fg); z-index: 2000; }
aside {
  border-left: 1px solid var(--rule); background: var(--panel); overflow-y: auto; min-height: 0; max-height: max(560px, calc(100vh - 80px));
  display: flex; flex-direction: column;
}
.sec { padding: 14px 16px; padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 10px; }
.sec h2.blk-title { font: 700 26px/1 var(--f-display); letter-spacing: .01em; text-transform: none; color: var(--fg); }
.sec h2 { margin: 0; font: 600 13px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.list { display: flex; flex-direction: column; }
.row {
  display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 10px;
  padding: 8px 16px; border: 0; border-bottom: 1px solid var(--rule); border-radius: 0; background: transparent;
  text-align: left; font: inherit; width: 100%;
}
.row:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.row[aria-current="true"] { background: color-mix(in srgb, var(--line-sel) 22%, transparent); }
.num {
  font: 700 18px/1 var(--f-display); text-align: center; padding: 6px 0; border-radius: 5px;
  background: var(--label-bg); color: var(--label-fg);
}
.row .note { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.row .area { font: 500 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.empty { padding: 18px 16px; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font: 500 11px var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; margin: 0; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.banner {
  position: absolute; z-index: 1000; left: 50%; transform: translateX(-50%); top: calc(12px + env(safe-area-inset-top, 0px));
  background: var(--panel); color: var(--fg); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px 8px 14px;
  display: flex; gap: 10px; align-items: center; box-shadow: 0 6px 24px rgba(0,0,0,.25); max-width: calc(100% - 32px); flex-wrap: wrap;
}
.banner p { margin: 0; font-size: 13px; }
.legend {
  position: absolute; z-index: 800; right: calc(10px + env(safe-area-inset-right, 0px)); top: calc(10px + env(safe-area-inset-top, 0px));
  background: var(--label-bg); color: var(--label-fg); border-radius: 6px; padding: 8px 10px; display: flex; flex-direction: column; gap: 5px;
  font: 500 12px var(--f-body);
}
.legend label { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; padding: 2px 0; }
.legend input { margin: 0; width: 14px; height: 14px; accent-color: var(--line-sel); cursor: pointer; }
.legend label:has(input:not(:checked)) { opacity: .55; }
.legend i { width: 14px; height: 10px; border-radius: 2px; border: 2px solid; box-sizing: border-box; }
.legend .k-bone { border-color: var(--line-bone); background: color-mix(in srgb, var(--line-bone) 35%, transparent); }
.legend .k-none { border-color: var(--line); background: color-mix(in srgb, var(--line) 20%, transparent); }
.coords {
  position: absolute; z-index: 800; left: calc(10px + env(safe-area-inset-left, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  font: 500 12px var(--f-mono); background: var(--label-bg); color: var(--label-fg); padding: 4px 8px; border-radius: 4px; pointer-events: none;
  font-variant-numeric: tabular-nums;
}
.notice { margin: 0; font-size: 13px; color: var(--muted); }
/* map marks */
.leaflet-container { font-family: var(--f-body); background: var(--seabed); }
path.blk-halo { stroke: var(--halo); stroke-width: 6px; fill: none; pointer-events: none; }
path.blk { stroke: var(--line); stroke-width: 2.5px; fill: var(--line); fill-opacity: .07; }
path.blk:hover { fill-opacity: .2; }
path.blk.bone { stroke: var(--line-bone); fill: var(--line-bone); fill-opacity: .14; }
path.blk.bone:hover { fill-opacity: .28; }
path.blk.sel { stroke: var(--line-sel); fill: var(--line-sel); fill-opacity: .16; stroke-width: 3px; }
path.subfrag { stroke: #fffbe6; stroke-width: 2px; stroke-dasharray: 6 4; fill: none; pointer-events: none; }
path.subfrag-halo { stroke: rgba(29, 22, 0, .6); stroke-width: 4.5px; fill: none; pointer-events: none; }
.leaflet-tooltip.sub-label { background: #fffbe6; color: #1d1600; border: 0; box-shadow: none; border-radius: 3px; font: 600 12px/1 var(--f-mono); padding: 3px 5px; }
.leaflet-tooltip.sub-label.bone { background: var(--line-bone); color: #fff; }
.leaflet-tooltip.sub-label::before { display: none; }
path.grid { stroke: rgba(255,255,255,.28); stroke-width: 1px; pointer-events: none; }
.leaflet-tooltip.blk-label {
  background: var(--label-bg); color: var(--label-fg); border: 0; box-shadow: none; border-radius: 4px;
  font: 700 15px/1 var(--f-display); padding: 3px 7px;
}
.leaflet-tooltip.blk-label::before { display: none; }
.leaflet-tooltip.blk-label.bone { background: var(--line-bone); color: #fff; }
.leaflet-tooltip.blk-label.sel { background: var(--line-sel); color: #1d1600; }
.gridlbl { font: 500 10px var(--f-mono); color: rgba(255,255,255,.75); text-shadow: 0 0 3px #000; white-space: nowrap; }
.leaflet-control-scale-line { background: var(--label-bg); color: var(--label-fg); border-color: var(--label-fg); font: 500 11px var(--f-mono); }
.zoombar a { display: grid; place-items: center; font: 600 18px/1 var(--f-body); }
.leaflet-bar a { background: var(--panel); color: var(--fg); border-color: var(--rule); }
.rec { display: flex; flex-direction: column; gap: 14px; }
.rsec { display: flex; flex-direction: column; gap: 6px; }
.rsec h3 { margin: 0; font: 500 11px var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font-size: 14px; }
.kv dt { font: 500 12px/1.6 var(--f-mono); color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.ids { display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 0; list-style: none; }
.ids code { font: 500 13px var(--f-mono); user-select: all; overflow-wrap: anywhere; }
.ids small { display: block; color: var(--muted); font-size: 12px; }
.bone-yes { font-weight: 600; }
.bone-no { color: var(--muted); }
.bag { align-self: flex-start; font: 500 13px var(--f-mono); padding: 4px 8px; border: 1px dashed var(--muted); border-radius: 4px; }

let recKey = "";
function renderRecords(b) {
  const box = $("rec"), recs = Array.isArray(b.records) ? b.records : [];
  const key = b.id + JSON.stringify(recs);
  if (key === recKey) return; recKey = key;
  box.textContent = "";
  if (!recs.length) {
    box.append(el("p", "src", "No details recorded for this block yet.")); return;
  }
  // Block IDs
  const s1 = sec("Block IDs"), ul = el("ul", "ids");
  for (const r of recs) { const li = el("li"); li.append(el("code", null, r.id)); if (r.notes) li.append(el("small", null, r.notes)); ul.append(li); }
  s1.append(ul);
  const notEx = r => /not yet excavated/i.test(r.status || "");
  function bonesSec() {
    const s = sec("Bones embedded"), bl = el("ul", "ids");
    for (const r of recs) {
      const li = el("li");
      li.append(r.boneConfirmed ? el("span", "bone-yes", r.bones || "Confirmed, not yet identified") : el("span", "bone-no", "None"), " - " + plainSub(subOf(r.id)));
      bl.append(li);
    }
    s.append(bl); return s;
  }
  if (recs.every(notEx)) {
    box.append(el("div", "unexc", "Not yet excavated"), s1);
    if (recs.some(r => r.boneConfirmed)) box.append(bonesSec());
    return;
  }
  // Date excavated
  const s2 = sec("Date excavated"), fmtDate = r => notEx(r) ? "Not yet excavated" : (r.dateExcavated || "Not recorded");
  const one = sameAll(recs, fmtDate);
  s2.append(one !== undefined ? el("div", /^Not /.test(one) ? "bone-no" : null, one) : kvList(recs, fmtDate));
  // Bones embedded
  const s3 = bonesSec();
  // Associated pieces: label written on the separately kept bag
  const s4 = sec("Associated pieces"), bag = r => r.associated ? String(r.associated) : "None listed";
  const oneBag = sameAll(recs, bag);
  s4.append(oneBag !== undefined ? el("span", oneBag === "None listed" ? "bone-no" : "bag", oneBag) : kvList(recs, r => el("span", r.associated ? "bag" : "bone-no", bag(r))));
  // Current status
  const s5 = sec("Current status"), st = sameAll(recs, r => r.status || "Not recorded");
  if (st !== undefined) s5.append(el("span", "pill", st)); else s5.append(kvList(recs, r => el("span", "pill", r.status || "Not recorded")));
  // Images
  const s6 = sec("Images"), photos = recs.filter(r => r.photo);
  if (!photos.length) s6.append(el("span", "bone-no", "No photos listed in the sheet"));
  else {
    const g = el("div", "thumbs");
    for (const r of photos) {
      const t = el("button", "thumb"); t.type = "button";
      const im = el("img"); decUrl(r.photo, "image/jpeg").then(u => { im.src = u; }); im.alt = "Photo of " + r.id;
      t.append(im);
      t.addEventListener("click", () => decUrl(r.photo, "image/jpeg").then(u => openPhoto(u, r.id)));
      g.append(t);
    }
    s6.append(g);
  }
  box.append(s1, s2, s3, s4, s5, s6);
}
let lbReturn = null;
function openPhoto(src, cap) { lbReturn = document.activeElement; $("lb-img").src = src; $("lb-img").alt = cap; $("lb-cap").textContent = cap; $("lightbox").hidden = false; $("lb-close").focus(); }
function closePhoto() { $("lightbox").hidden = true; $("lb-img").removeAttribute("src"); if (lbReturn) lbReturn.focus(); }
$("lb-close").addEventListener("click", closePhoto);
$("lightbox").addEventListener("click", e => { if (e.target.id === "lightbox") closePhoto(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("lightbox").hidden) { e.stopImmediatePropagation(); closePhoto(); } }, true);

function render() {
  syncLayers();
  const sel = blocks.find(x => x.id === selectedId);
  if (drawSubs(sel)) { const l = layers.get(sel.id); if (l) l.poly.closeTooltip(); }
  renderStats(); renderDetail();
}

function select(id, fly) {
  selectedId = id;
  render();
  const l = layers.get(id);
  if (fly && l) map.flyToBounds(l.poly.getBounds(), { padding: [70, 70], maxZoom: 3.25, duration: matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : .3, easeLinearity: .35 });
}
map.on("click", () => { if (selectedId) { selectedId = null; render(); } });

// ---- banner ----
function banner(text, buttons) {
  const bn = $("banner"); bn.hidden = !text;
  $("banner-text").textContent = text || "";
  const bb = $("banner-btns"); bb.textContent = "";
  for (const [label, fn] of buttons || []) {
    const btn = document.createElement("button"); btn.type = "button"; btn.textContent = label;
    btn.addEventListener("click", fn); bb.append(btn);
  }
}
$("b-close").addEventListener("click", () => { selectedId = null; render(); });
L.DomEvent.disableClickPropagation($("legend"));
L.DomEvent.disableScrollPropagation($("legend"));
for (const [id, key] of [["t-bone", "bone"], ["t-none", "none"]]) {
  $(id).addEventListener("change", e => {
    show[key] = e.target.checked;
    const sel = blocks.find(x => x.id === selectedId);
    if (sel && !visible(sel)) selectedId = null;
    render();
  });
}

// ---- block data: published with the page, so no sign-in is needed ----
(async () => {
  try {
    const data = JSON.parse(new TextDecoder().decode(await decFetch("data/blocks.json")));
    blocks = (data.blocks || []).filter(b => Array.isArray(b.outline) && b.outline.length >= 3);
    render();
  } catch (e) {
    renderStats();
    banner("The block outlines didn't load. Reload the page to try again.", [["Dismiss", () => banner(null)]]);
  }
})();
</script>
